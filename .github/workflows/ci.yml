name: Validate site

on:
  pull_request:
    paths:
      - .github/workflows/ci.yml
      - AGENT_DISCOVERY_PLAYBOOK.md
      - AGENT_DISCOVERY_RUNBOOK.md
      - PORTAL_DISCOVERY_AGENT_PROMPT.md
      - .node-version
      - babel.config.js
      - docusaurus.config.ts
      - package.json
      - package-lock.json
      - postman/**
      - plugins/**
      - specifications/**
      - src/**
      - static/**
      - tsconfig.json
      - tools/capture-recipes/**
      - tools/portal-discovery-portfolio.json
      - tools/postman-collection-definitions.mjs
      - tools/discovery-evidence-inputs.mjs
      - tools/inspect-discovery-inputs.mjs
      - tools/tests/discovery-evidence-inputs.test.mjs
      - tools/generate-postman-collections.mjs
      - tools/discovery-derivative-families.mjs
      - tools/tests/discovery-derivative-families.test.mjs
      - tools/discovery-review-assignments.mjs
      - tools/portal-discovery-promotion-planner.mjs
      - tools/tests/portal-discovery-promotion-planner.test.mjs
      - tools/generate-operation-context-ledger.mjs
      - tools/generate-operation-live-capture-ledger.mjs
      - tools/generate-portal-coverage-ledger.mjs
      - tools/generate-spec-quality.mjs
      - tools/portal-discovery-metadata.mjs
      - tools/portal-discovery-ledger.mjs
      - tools/run-portal-discovery.mjs
      - tools/browser-cdp-owner.mjs
      - tools/tests/browser-cdp-owner.test.mjs
      - tools/browser-cdp-preflight.mjs
      - tools/tests/browser-cdp-preflight.test.mjs
      - tools/tests/portal-discovery-ledger.test.mjs
      - tools/spec-quality-lib.mjs
      - tools/validate-portal-discovery-metadata.mjs
      - tools/validate-spec-quality.mjs
  push:
    branches:
      - main
    paths:
      - .github/workflows/ci.yml
      - AGENT_DISCOVERY_PLAYBOOK.md
      - AGENT_DISCOVERY_RUNBOOK.md
      - PORTAL_DISCOVERY_AGENT_PROMPT.md
      - .node-version
      - babel.config.js
      - docusaurus.config.ts
      - package.json
      - package-lock.json
      - postman/**
      - plugins/**
      - specifications/**
      - src/**
      - static/**
      - tsconfig.json
      - tools/capture-recipes/**
      - tools/portal-discovery-portfolio.json
      - tools/postman-collection-definitions.mjs
      - tools/discovery-evidence-inputs.mjs
      - tools/inspect-discovery-inputs.mjs
      - tools/tests/discovery-evidence-inputs.test.mjs
      - tools/generate-postman-collections.mjs
      - tools/discovery-derivative-families.mjs
      - tools/tests/discovery-derivative-families.test.mjs
      - tools/discovery-review-assignments.mjs
      - tools/portal-discovery-promotion-planner.mjs
      - tools/tests/portal-discovery-promotion-planner.test.mjs
      - tools/generate-operation-context-ledger.mjs
      - tools/generate-operation-live-capture-ledger.mjs
      - tools/generate-portal-coverage-ledger.mjs
      - tools/generate-spec-quality.mjs
      - tools/portal-discovery-metadata.mjs
      - tools/portal-discovery-ledger.mjs
      - tools/run-portal-discovery.mjs
      - tools/browser-cdp-owner.mjs
      - tools/tests/browser-cdp-owner.test.mjs
      - tools/browser-cdp-preflight.mjs
      - tools/tests/browser-cdp-preflight.test.mjs
      - tools/tests/portal-discovery-ledger.test.mjs
      - tools/spec-quality-lib.mjs
      - tools/validate-portal-discovery-metadata.mjs
      - tools/validate-spec-quality.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate spec quality
        run: npm run validate:spec-quality

      - name: Validate portal discovery metadata
        run: npm run validate:portal-discovery

      - name: Validate discovery evidence inputs
        run: npm run validate:discovery-inputs

      - name: Validate generated site data
        run: npm run validate:site-data

      - name: Build site
        run: npm run build

      - name: Typecheck
        run: npm run typecheck
