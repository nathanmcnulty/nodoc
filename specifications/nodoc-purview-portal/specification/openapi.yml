              - The observed cached-role envelope retains its declared types; role, permission, service-plan and feature dictionary entries are not reproduced. A cache response does not prove effective grants or minimum roles.
              - The bounded run remains incomplete at its initial navigation checkpoint; this observation does not establish whole-spec or product health.
          - source: authenticated-portal-capture-20261030
            confidence: high
