  /api/auth/IsInRoles:
    post:
      tags: [ Auth ]
      summary: Evaluate role and feature membership
      description: |
        Evaluates a batch of role, permission, and feature identifiers and returns a positional boolean
        array indicating which entries are available to the current portal session. The optional
        `cache` flag was observed with both boolean values during normal solution navigation.

        This POST is documented from passive portal traffic only. Never probe or replay it, alter
        its role inputs or scope, or treat it as write-safe.
      operationId: PurviewPortal.Auth.IsInRoles
      parameters:
        - name: cache
          in: query
          required: false
          description: Whether the portal requests cached role-evaluation results.
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurviewPortalRoleCheckRequest'
      x-nodoc-operation-context:
        surface: Portal shell
        workflows:
          - Load startup or switch Purview solutions so the portal can batch-check role, permission, and feature availability.
        authProfile: purview-portal-role-evaluation
        requestShapes:
          - name: role-or-feature-batch
            contentType: application/json
            bodyKind: string-array
            notes: The portal posts an ordered list of permission, role, or feature identifiers and receives positional boolean results.
        availability:
          level: user-context
          notes:
            - Evaluation results are specific to the signed-in principal and current tenant.
        provenance:
          - source: live-portal-capture
            confidence: high
            notes:
              - Verified during startup and solution transitions in a signed-in Purview portal session.
              - The optional cache query flag was observed as true and false in passive traffic; no request was replayed.
          - source: retained-native-portal-evidence-reviewed-20261030
            confidence: high
            notes:
              - Exact declared POST purview.microsoft.com/api/auth/IsInRoles maps to canonical /api/auth/IsInRoles; current declared server/base/path and original request binding were checked privately.
              - Retained purview-portal-02 action 2 at 2026-10-29T22:45:49.408Z; evidence request-fd77447824b55c3c69c0; HTTP 200 complete body privately verified.
              - Retained purview-portal-remediation-01 action 0 at 2026-10-30T12:38:24.484Z; evidence request-ebcf12e537daae32dc65; HTTP 200 complete body privately verified.
              - Original capture dates and action attribution are retained. Reusing these bodies for offline review does not create a fresh native observation or clear any historical run-level accounting gaps.
              - HTTP 200, complete body bytes and limited type checks do not establish application/business success, feature availability, entitlement, provisioning, effective permissions or minimum roles.
              - This POST was passively observed during the original portal capture, not authored, invoked, probed or replayed by this review. Request shape remains unknown because no complete verified request sidecar is available; replay safety, idempotence, effects and rollback are unproven.
              - Captured scalar values, role/feature-map keys, credentials, tenant data, response fingerprints, byte lengths and examples are withheld. No new route or requiredness, enum, format, authentication or standalone execution claim follows.
      responses:
        '200':
          description: Role evaluation completed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurviewPortalRoleCheckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/adminauditlogconfig/:
    get:
      tags: [ Audit ]
      summary: Get admin audit log configuration
      description: |
        Returns the tenant's Purview admin audit log ingestion status and first opt-in timestamp.
        Confirmed live from the Settings experience.
      operationId: PurviewPortal.Audit.GetAdminAuditLogConfig
      responses:
        '200':
          description: Admin audit log settings returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurviewPortalAdminAuditLogConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/user/:
    get:
      tags: [ Users ]
      summary: Search users for portal pickers
      description: |
        Returns user objects used by Purview pickers and assignment flows. Confirmed live from
        same-origin user lookup traffic while browsing the portal.
      operationId: PurviewPortal.Users.Search
      x-nodoc-live-capture:
        source: authenticated Microsoft Purview portal passive representative states
        browsedPages:
          - Microsoft Purview portal
      x-nodoc-operation-context:
        surface: Microsoft Purview portal
        workflows:
          - Observe native requests during approved passive representative portal states.
        availability:
          level: user-context
          notes:
            - One authenticated portal session; standalone execution, parameter requiredness, effective grants and minimum roles are not established.
        provenance:
          - source: live-authenticated-capture
            confidence: high
            notes:
              - GET purview.microsoft.com/api/user/; HTTP 200; action 5; observed 2026-10-29T22:46:40.621Z; complete response privately hash-verified.
              - The selected user-array fields retain their declared string/nullability types; identities and profile values are not reproduced.
              - This current HTTP response is scoped evidence only; the broader initial-action accounting gap and standalone/minimum-role uncertainty remain.
      parameters:
        - name: query
          in: query
          required: false
          description: Free-text search string used by the portal picker.
          schema:
            type: string
      responses:
        '200':
          description: User picker results returned successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PurviewPortalUser'
        '400':
