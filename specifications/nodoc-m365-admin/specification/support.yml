components:
  schemas:
    SupportFeatureSettings:
      type: object
      required: [BizAssistPlacements, IsUpSellEnable]
      properties:
        BizAssistPlacements:
          type: object
          required: [CancelCount, TicketDetailsShow]
          properties:
            CancelCount:
              type: integer
            TicketDetailsShow:
              type: boolean
        IsUpSellEnable:
          type: boolean
    SupportLanguage:
      type: object
      required: [LCID, Name, NativeName]
      properties:
        LCID:
          type: integer
        Name:
          type: string
        NativeName:
          type: string
    SupportTimeZone:
      type: object
      required: [DisplayName, IanaTimeZone, Id, offset]
      properties:
        DisplayName:
          type: string
        IanaTimeZone:
          type: string
        Id:
          type: string
        offset:
          type: string
    LazyLoadingSupportConfig:
      type: object
      required: [CanTenantEscalateForSED, CanTenantEscalateToEngineer, SupportLanguages, TimeZones]
      properties:
        CanTenantEscalateForSED:
          type: boolean
        CanTenantEscalateToEngineer:
          type: boolean
        SupportLanguages:
          type: array
          items:
            $ref: '#/components/schemas/SupportLanguage'
        TimeZones:
          type: array
          items:
            $ref: '#/components/schemas/SupportTimeZone'
    DirectSupportVendor:
      type: object
      required: [CommunityLink, CountryCode, MoreInfo, PhoneNumber, TicketCreationLink]
      properties:
        CommunityLink:
          type: string
          format: uri
        CountryCode:
          type: string
        MoreInfo:
          type: string
        PhoneNumber:
          type: string
        TicketCreationLink:
          type: string
          format: uri-reference
    SupportVendorsResponse:
      type: object
      required: [DirectSupport, Partners]
      properties:
        DirectSupport:
          $ref: '#/components/schemas/DirectSupportVendor'
        Partners:
          type: array
          items:
            type: object
            additionalProperties: true

