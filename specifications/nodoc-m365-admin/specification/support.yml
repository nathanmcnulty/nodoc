components:
  schemas:
    SupportFeatureSettings:
      type: object
      required: [BizAssistPlacements, IsUpSellEnable]
      properties:
        BizAssistPlacements:
          type: object
          required: [CancelCount, TicketDetailsShow]
          properties:
            CancelCount:
              type: integer
            TicketDetailsShow:
              type: boolean
        IsUpSellEnable:
          type: boolean
    SupportLanguage:
      type: object
      required: [LCID, Name, NativeName]
      properties:
        LCID:
          type: integer
        Name:
          type: string
        NativeName:
          type: string
    SupportTimeZone:
      type: object
      required: [DisplayName, IanaTimeZone, Id, offset]
      properties:
        DisplayName:
          type: string
        IanaTimeZone:
          type: string
        Id:
          type: string
        offset:
          type: string
    LazyLoadingSupportConfig:
      type: object
      required: [CanTenantEscalateForSED, CanTenantEscalateToEngineer, SupportLanguages, TimeZones]
      properties:
        CanTenantEscalateForSED:
          type: boolean
        CanTenantEscalateToEngineer:
          type: boolean
        SupportLanguages:
          type: array
          items:
            $ref: '#/components/schemas/SupportLanguage'
        TimeZones:
          type: array
          items:
            $ref: '#/components/schemas/SupportTimeZone'
    DirectSupportVendor:
      type: object
      required: [CommunityLink, CountryCode, MoreInfo, PhoneNumber, TicketCreationLink]
      properties:
        CommunityLink:
          type: string
          format: uri
        CountryCode:
          type: string
        MoreInfo:
          type: string
        PhoneNumber:
          type: string
        TicketCreationLink:
          type: string
          format: uri-reference
    SupportVendorsResponse:
      type: object
      required: [DirectSupport, Partners]
      properties:
        DirectSupport:
          $ref: '#/components/schemas/DirectSupportVendor'
        Partners:
          type: array
          items:
            type: object
            additionalProperties: true

paths:
  /api/concierge/DefaultMinimizeSupportWidget:
    get:
      operationId: Support.GetDefaultMinimizeSupportWidget
      summary: Get the default support-widget minimized state
      tags: [Support]
      servers:
        - url: https://admin.microsoft.com
      x-nodoc-operation-safety:
        class: read-only
        tenantMutationObserved: false
      x-nodoc-evidence:
        record: ../evidence/shared-support-concierge.json
        responseShapeDigest: a5b031ab62bc416d720c0410d802ea46b910c4fbe85c50a946ccc658b74e677e
      responses:
        '200':
          description: The default minimized state.
          content:
            application/json:
              schema:
                type: boolean
        '401':
          $ref: common.yml#/components/responses/Unauthorized
        '403':
          $ref: common.yml#/components/responses/Forbidden

