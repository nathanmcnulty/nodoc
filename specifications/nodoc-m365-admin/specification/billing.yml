      operationId: Billing.ListNeptuneCreditRequests
      tags: [Billing]
      parameters:
        - name: includeCount
          in: query
          description: Whether to include the aggregate result count.
          schema:
            type: boolean
        - name: service
          in: query
          description: Service filter sent by the portal.
          schema:
            type: string
        - name: states
          in: query
          description: State filter sent by the portal.
          schema:
            type: string
        - name: top
          in: query
          description: Maximum number of records requested by the portal.
          schema:
            type: integer
      x-nodoc-operation-context:
        surface: Billing and licenses
        provenance:
          - source: live-portal-capture
            confidence: high
            notes:
              - Observed as a successful normal-UI read during bounded portal navigation.
      responses:
        '200':
          description: Credit-request collection observed in the portal response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
