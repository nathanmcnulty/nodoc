paths:
  /admin/api/licenses/requests/summary:
    get:
      summary: Get license request summary
      description: Retrieve aggregate license-request activity for the admin portal.
      operationId: Billing.GetLicenseRequestSummary
      tags: [Billing]
      x-nodoc-operation-context:
        surface: Billing and licenses
        provenance:
          - source: live-portal-capture
            confidence: high
            notes:
              - Observed as a successful normal-UI read during bounded portal navigation.
      responses:
        '200':
          description: License-request summary observed in the portal response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  RequestCount:
                    type: integer
                  LastCreatedTime:
                    type: string
                    format: date-time
                  Items:
                    type: array
                    items: {}
        '401':
          $ref: common.yml#/components/responses/Unauthorized
        '403':
          $ref: common.yml#/components/responses/Forbidden
        '404':
          $ref: common.yml#/components/responses/NotFound

  /admin/api/neptunelicensing/configurationplans:
