  /fd/arm/providers/Microsoft.Billing/billingAccounts/{billingAccountId}/billingSubscriptions/{billingSubscriptionId}/fetchProductDetails:
    post:
      summary: Fetch billing subscription product details
      description: >-
        Retrieve product details for a billing subscription. The portal carries this
        read-only lookup as POST with an empty JSON object.
      operationId: Billing.FetchSubscriptionProductDetails
      tags: [Billing]
      parameters:
        - name: billingAccountId
          in: path
          required: true
          description: ARM billing account identifier.
          schema:
            type: string
        - name: billingSubscriptionId
          in: path
          required: true
          description: Billing subscription identifier.
          schema:
            type: string
        - name: api-version
          in: query
          description: ARM billing API version.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              maxProperties: 0
      x-nodoc-operation-context:
        surface: Billing subscriptions
        authProfile: m365-admin-brokered-arm-token
        requestShapes:
          - name: product-details-read
            contentType: application/json
            bodyKind: object
            notes: Read-only lookup observed with an empty JSON object.
        provenance:
          - source: live-portal-capture
            confidence: high
            notes:
              - Observed as a successful normal-UI lookup during bounded portal navigation.
      responses:
        '200':
          description: Successful product-details response observed in normal portal traffic.
        '401':
          $ref: common.yml#/components/responses/Unauthorized
        '403':
          $ref: common.yml#/components/responses/Forbidden
        '404':
          $ref: common.yml#/components/responses/NotFound

  /fd/arm/providers/Microsoft.Billing/billingAccounts/{billingAccountId}/checkAccess:
    post:
      summary: Check billing account access
      description: >-
        Evaluate whether the current administrator can perform requested billing actions.
        This operation returns access decisions and does not perform the submitted actions.
      operationId: Billing.CheckBillingAccountAccess
      tags: [Billing]
      parameters:
        - name: billingAccountId
          in: path
          required: true
          description: ARM billing account identifier.
          schema:
            type: string
        - name: api-version
          in: query
          description: ARM billing API version.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actions]
              properties:
                actions:
                  type: array
                  items:
                    type: string
      x-nodoc-operation-context:
        surface: Marketplace and billing subscriptions
        authProfile: m365-admin-brokered-arm-token
        requestShapes:
          - name: billing-access-check
            contentType: application/json
            bodyKind: object
            notes: Read-only authorization check for the requested action names.
        provenance:
          - source: live-portal-capture
            confidence: high
            notes:
              - Observed as a successful normal-UI access check during bounded portal navigation.
      responses:
        '200':
          description: Billing access decisions observed in the portal response.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    accessDecision:
                      type: string
                    action:
                      type: string
        '401':
          $ref: common.yml#/components/responses/Unauthorized
        '403':
          $ref: common.yml#/components/responses/Forbidden
        '404':
          $ref: common.yml#/components/responses/NotFound

