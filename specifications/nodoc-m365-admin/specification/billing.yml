                    items: {}
                  count:
                    type: integer
        '401':
          $ref: common.yml#/components/responses/Unauthorized
        '403':
          $ref: common.yml#/components/responses/Forbidden
        '404':
          $ref: common.yml#/components/responses/NotFound

  /fd/arm/providers/Microsoft.Billing/billingAccounts/{billingAccountId}/billingProfiles/{billingProfileId}/providers/Microsoft.Marketplace/products:
    get:
      summary: List marketplace products
      description: >-
        Retrieve read-only marketplace product results for a billing profile.
        Observed while the marketplace catalog loaded; this is not a purchase operation.
      operationId: Billing.ListMarketplaceProducts
      tags: [Billing]
      parameters:
        - name: billingAccountId
          in: path
          required: true
          description: ARM billing account identifier.
          schema:
            type: string
        - name: billingProfileId
          in: path
          required: true
          description: ARM billing profile identifier.
          schema:
            type: string
        - name: $expand
          in: query
          description: Optional ARM expansion expression.
          schema:
            type: string
        - name: $filter
          in: query
          description: Optional marketplace product filter.
          schema:
            type: string
        - name: $top
          in: query
          description: Maximum number of products requested.
          schema:
            type: integer
        - name: api-version
          in: query
          description: ARM Marketplace API version.
          schema:
            type: string
        - name: language
          in: query
          description: Optional response language.
          schema:
            type: string
        - name: market
          in: query
          description: Marketplace region code.
          schema:
            type: string
      x-nodoc-operation-context:
        surface: Marketplace catalog
        authProfile: m365-admin-brokered-arm-token
        provenance:
          - source: live-portal-capture
            confidence: high
            notes:
              - Observed as successful normal-UI catalog traffic during bounded portal navigation.
      responses:
        '200':
          description: Successful marketplace product responses observed in normal portal traffic.
        '401':
          $ref: common.yml#/components/responses/Unauthorized
        '403':
          $ref: common.yml#/components/responses/Forbidden
        '404':
          $ref: common.yml#/components/responses/NotFound

