paths:
  /edlp/dlpInternalApi/api/cloud/dlp/machines/count:
    get:
      operationId: getEndpointDlpMachineCount
      summary: Get endpoint DLP machine count
      description: >-
        Retrieve the endpoint DLP machine count for a lookback window, with
        optional policy-update and configuration-status filters.
      tags: [DLPDevices]
      x-nodoc-operation-safety:
        class: read-only
        tenantMutationObserved: false
      x-nodoc-evidence:
        record: ../evidence/purview-graph-refresh.json
        responseShapeDigest: fcc8f147274bc649a777f85ceeb2a7b91222e1e6903e53ef9135e13820ca1618
      parameters:
        - name: lookingBackInDays
          in: query
          required: false
          schema:
            type: integer
        - name: lastPolicyUpdateTime
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: configurationStatus
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Endpoint DLP machine count.
          content:
            application/json:
              schema:
                type: object
                required: [Count]
                properties:
                  Count:
                    type: integer
        '401':
          $ref: common.yml#/components/responses/Unauthorized
        '403':
          $ref: common.yml#/components/responses/Forbidden

  /edlp/dlpInternalApi/api/cloud/dlp/machines/summaryStatus:
    get:
      operationId: getEndpointDlpMachineSummaryStatus
      summary: Get endpoint DLP machine status history
      description: >-
        Retrieve aggregate endpoint DLP machine counts over time for a
        lookback window and optional policy-update cutoff.
      tags: [DLPDevices]
      x-nodoc-operation-safety:
        class: read-only
        tenantMutationObserved: false
      x-nodoc-evidence:
        record: ../evidence/purview-graph-refresh.json
        responseShapeDigest: 96b9efcd1ccffab4e2ee9d33e939e21c09fc738d8e8bbc4df2d1cb8d9d25baa5
      parameters:
        - name: lookingBackInDays
          in: query
          required: false
          schema:
            type: integer
        - name: lastPolicyUpdateTime
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Time-bucketed endpoint DLP machine counts.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [TimeLabel, TotalCount]
                  properties:
                    TimeLabel:
                      type: string
                    TotalCount:
                      type: integer
        '401':
          $ref: common.yml#/components/responses/Unauthorized
        '403':
          $ref: common.yml#/components/responses/Forbidden

  /mtp/ndr/dlpmachines/count:
    get:
      operationId: getDlpMachineCount
      summary: Get DLP machine count
      description: >-
        Retrieve the total count of DLP-managed machines. Supports filtering by
        lookback period, policy update time, and configuration status.
      tags: [DLPDevices]
      parameters:
        - name: lookingBackInDays
          in: query
          required: false
          description: Number of days to look back for machine activity.
          schema:
            type: integer
        - name: lastPolicyUpdateTime
          in: query
          required: false
          description: Filter by the last time a policy was updated on the machine.
          schema:
            type: string
            format: date-time
        - name: configurationStatus
          in: query
          required: false
          description: Filter by the DLP configuration status of machines.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

  /mtp/ndr/dlpmachines:
    get:
      operationId: listDlpMachines
      summary: List DLP machines
      description: >-
        Retrieve a paginated list of DLP-managed machines. Supports filtering by
        policy update time, lookback period, configuration status, and tenant.
      tags: [DLPDevices]
      parameters:
        - name: lastPolicyUpdateTime
          in: query
          required: false
          description: Filter by the last time a policy was updated on the machine.
          schema:
            type: string
            format: date-time
        - name: lookingBackInDays
          in: query
          required: false
          description: Number of days to look back for machine activity.
          schema:
            type: integer
        - name: pageSize
          in: query
          required: false
          description: The number of results to return per page.
          schema:
            type: integer
        - name: pageIndex
          in: query
          required: false
          description: The page index for pagination (zero-based).
          schema:
            type: integer
        - name: configurationStatus
          in: query
          required: false
          description: Filter by the DLP configuration status of machines.
          schema:
            type: string
        - name: tenantId
          in: query
          required: false
          description: The unique identifier (GUID) of the tenant.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

  /mtp/ndr/dlpmachines/summaryStatus:
    get:
      operationId: getDlpMachinesSummaryStatus
      summary: Get DLP machines summary status
      description: >-
        Retrieve a summary of DLP machine statuses. Returns aggregated counts
        of machines grouped by their configuration and health status.
      tags: [DLPDevices]
      parameters:
        - name: lookingBackInDays
          in: query
          required: false
          description: Number of days to look back for machine activity.
          schema:
            type: integer
        - name: lastPolicyUpdateTime
          in: query
          required: false
          description: Filter by the last time a policy was updated on the machine.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

  /mtp/sccManagement/mgmt/TenantContext:
    get:
      operationId: getMtpTenantContext
      summary: Get shared MTP tenant context
      description: >-
        Retrieve shared Microsoft Threat Protection tenant context used by Purview
        experiences that depend on MTP-backed licensing, workloads, and feature flags.
      tags: [DLPDevices]
      parameters:
        - name: realTime
          in: query
          required: false
          description: Request the latest tenant context instead of cached startup state.
          schema:
            type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: common.yml#/components/schemas/MtpTenantContextResponse
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

  /mtp/incidentQueue/incidents/alerts:
    post:
      operationId: queryIncidentAlerts
      summary: Query incident alerts
      description: >-
        Query incident alerts from the Microsoft Threat Protection incident queue.
        Returns alerts matching the specified query criteria.
      tags: [DLPDevices]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: pending
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

  /mtp/ndr/dlpmachines/filters:
    get:
      operationId: getDlpMachineFilters
      summary: Get DLP machine filters
      description: >-
        Retrieve the filter options used by Purview's affected devices drill-in
        from the Data Loss Prevention overview page.
      tags: [DLPDevices]
      parameters:
        - name: lookingBackInDays
          in: query
          required: false
          description: Number of days to look back for machine activity.
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

  /edlp/dlpInternalApi/api/cloud/dlp/logCollections/:
    get:
      operationId: listEndpointDlpLogCollections
      summary: List endpoint DLP log collections
      description: >-
        Retrieve endpoint DLP log collection status for a device details blade
        surfaced from Purview device settings.
      tags: [DLPDevices]
      parameters:
        - name: MachineId
          in: query
          required: false
          description: The machine identifier for the device whose log collections are being queried.
          schema:
            type: string
        - name: Status
          in: query
          required: false
          description: Filter log collections by collection status.
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

  /edlp/dlpInternalApi/api/cloud/dlp/logCollectionsSetting:
    get:
      operationId: getEndpointDlpLogCollectionSettings
      summary: Get endpoint DLP log collection settings
      description: >-
        Retrieve endpoint DLP log collection settings used by Purview's device
        details blade.
      tags: [DLPDevices]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
