paths:
  /msgraph/v1.0/subscribedSkus:
    get:
      operationId: getSubscribedSkus
      summary: Get subscribed SKUs (license info)
      description: >-
        Retrieve the list of subscribed SKUs (license information) via the Microsoft Graph proxy.
        Returns all commercial subscriptions that the tenant has acquired.
      tags: [GraphProxy]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

  /msgraph/v1.0/directoryRoles:
    get:
      operationId: listDirectoryRoles
      summary: List directory roles
      description: >-
        Retrieve Microsoft Entra directory roles via the Graph proxy. Confirmed from
        Purview role-aware startup flows that enumerate active administrative roles.
      tags: [GraphProxy]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: common.yml#/components/schemas/GraphDirectoryRolesResponse
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

  /msgraph/v1.0/roleManagement/directory/roleAssignments:
    get:
      operationId: getDirectoryRoleAssignments
      summary: Get directory role assignments
      description: >-
        Retrieve directory role assignments via the Microsoft Graph proxy.
        Returns role assignments for Microsoft Entra ID directory roles.
      tags: [GraphProxy]
      parameters:
        - name: $filter
          in: query
          required: false
          description: OData filter expression to narrow role assignments.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

  /msgraph/beta/roleManagement/directory/transitiveRoleAssignments:
    get:
      operationId: getTransitiveRoleAssignments
      summary: Get transitive role assignments
      description: >-
        Retrieve transitive role assignments via the Microsoft Graph beta proxy.
        Returns all role assignments including those inherited through group membership.
      tags: [GraphProxy]
      parameters:
        - name: $filter
          in: query
          required: false
          description: OData filter expression to narrow role assignments.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

  /msgraph/beta/identity/conditionalAccess/policies:
    get:
      operationId: getConditionalAccessPolicies
      summary: Get conditional access policies
      description: >-
        Retrieve conditional access policies via the Microsoft Graph beta proxy.
        Returns the tenant's conditional access policy configurations.
      tags: [GraphProxy]
      parameters:
        - name: $filter
          in: query
          required: false
          description: OData filter expression to narrow policies.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

  /msgraph/v1.0/directory/administrativeUnits:
    get:
      operationId: getAdministrativeUnits
      summary: Get administrative units
      description: >-
        Retrieve administrative units via the Microsoft Graph proxy.
        Returns the tenant's administrative unit definitions for delegated administration.
      tags: [GraphProxy]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

  /msgraph/v1.0/admin/serviceAnnouncement/messages:
    get:
      operationId: getServiceAnnouncementMessages
      summary: Get service announcement messages
      description: >-
        Retrieve service announcement messages via the Microsoft Graph proxy.
        Returns service health and change notification messages from Microsoft 365.
      tags: [GraphProxy]
      x-nodoc-operation-safety:
        class: read-only
        tenantMutationObserved: false
      x-nodoc-evidence:
        record: ../evidence/defender-cross-portal-refresh.json
        responseShapeDigest: b06bfa455be239d9072c8bf42e8a9fc2cb3bc8867ca00a32f57a96a97d2a9583
      parameters:
        - name: $filter
          in: query
          required: false
          description: OData filter expression to narrow messages.
          schema:
            type: string
        - name: $orderby
          in: query
          required: false
          description: OData order by expression for sorting results.
          schema:
            type: string
        - name: $top
          in: query
          required: false
          description: The maximum number of results to return.
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  '@odata.context':
                    type: string
                  value:
                    type: array
                    items:
                      type: object
                      properties:
                        actionRequiredByDateTime:
                          type: string
                          format: date-time
                          nullable: true
                        body:
                          type: object
                          properties:
                            content:
                              type: string
                            contentType:
                              type: string
                        category:
                          type: string
                        details:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              value:
                                type: string
                        endDateTime:
                          type: string
                          format: date-time
                        hasAttachments:
                          type: boolean
                        id:
                          type: string
                        isMajorChange:
                          type: boolean
                        lastModifiedDateTime:
                          type: string
                          format: date-time
                        services:
                          type: array
                          items:
                            type: string
                        severity:
                          type: string
                        startDateTime:
                          type: string
                          format: date-time
                        tags:
                          type: array
                          items:
                            type: string
                        title:
                          type: string
                        viewPoint:
                          type: object
                          nullable: true
                          additionalProperties: true
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

  /msgraph/v1.0/me/getMemberObjects:
    post:
      operationId: getCurrentUserMemberObjects
      summary: Get current user's transitive memberships
      description: >-
        Resolve directory objects the current user is a member of through the Graph
        proxy. Purview used this request with `securityEnabledOnly=true` while
        evaluating effective access and workspace eligibility.
      tags: [GraphProxy]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: common.yml#/components/schemas/GraphMemberObjectsRequest
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: common.yml#/components/schemas/GraphMemberObjectsResponse
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound
