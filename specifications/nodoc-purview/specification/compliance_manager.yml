      tags: [ComplianceManager]
      parameters:
        - name: correlationId
          in: query
          required: false
          description: A correlation identifier for tracking the job.
          schema:
            type: string
            format: uuid
        - name: locale
          in: query
          required: false
          description: The locale for localized response content.
          schema:
            type: string
            example: en-us
      responses:
        '200':
          description: OK
          content:
