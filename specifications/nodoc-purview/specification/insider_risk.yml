paths:
  "/insiderrisk/insiderrisk/api/v1.0/{tenantId}/InsiderRiskAnalyticsInsightMetadata('{date}')":
    get:
      operationId: getInsiderRiskAnalyticsInsightMetadata
      summary: Get insider risk analytics insight metadata
      description: >-
        Retrieve insider risk analytics insight metadata for a specific date.
        Returns metadata about available risk analytics insights for the tenant.
      tags: [InsiderRisk]
      x-nodoc-operation-safety:
        class: read-only
        tenantMutationObserved: false
      x-nodoc-evidence:
        record: ../evidence/defender-cross-portal-refresh.json
        responseShapeDigest: 35ab762c6caaf0eb0590c94910166569805271cf05027c0fc4ce531008b15263
      parameters:
        - name: tenantId
          in: path
          required: true
          description: The unique identifier (GUID) of the tenant.
          schema:
            type: string
            format: uuid
        - name: date
          in: path
          required: true
          description: The date for which to retrieve insight metadata (ISO 8601 date format).
          schema:
            type: string
            format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, signalsStartDateTimeUtc, signalsEndDateTimeUtc]
                properties:
                  id:
                    type: string
                  signalsStartDateTimeUtc:
                    type: string
                    format: date-time
                  signalsEndDateTimeUtc:
                    type: string
                    format: date-time
            text/plain:
              schema:
                type: string
                description: Plain-text message returned when no analytics insight metadata exists for the requested date.
                example: 'Could not find tenant analytics insight: InsightsMetadata, query date: 2026-04-01.'
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

