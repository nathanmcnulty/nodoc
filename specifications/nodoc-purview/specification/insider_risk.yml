  /insiderrisk/insiderrisk/api/v1.0/{tenantId}/IptAllIndicatorsMergedProfile:
    post:
      operationId: calculateInsiderRiskMergedIndicatorProfile
      summary: Calculate merged indicator profile
      description: >-
        Calculate a merged Insider Risk indicator profile for supplied thresholds.
        The portal carries this bounded read-only calculation as POST.
      tags: [InsiderRisk]
      parameters:
        - name: tenantId
          in: path
          required: true
          description: The unique identifier (GUID) of the tenant.
          schema:
            type: string
            format: uuid
        - name: customError
          in: query
          required: false
          description: Request the custom error-handling behavior used by the portal.
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - aggregateFacetType
                - policyScope
                - indicatorThresholdInput
              properties:
                aggregateFacetType:
                  type: string
                policyScope:
                  type: string
                indicatorThresholdInput:
                  type: array
                  items:
                    type: object
                    required: [indicator, threshold]
                    properties:
                      indicator:
                        type: string
                      threshold:
                        type: integer
      x-nodoc-operation-context:
        surface: Insider Risk Management overview
        authProfile: purview-portal-session
        requestShapes:
          - name: merged-indicator-profile-calculation
            contentType: application/json
            bodyKind: object
            notes: Read-only aggregate calculation over supplied indicator thresholds.
        provenance:
          - source: live-portal-capture
            confidence: high
            notes:
              - Observed as a successful bounded normal-UI calculation.
      responses:
        '200':
          description: Merged indicator profile calculation observed in normal portal traffic.
        '401':
          $ref: common.yml#/components/responses/Unauthorized
        '403':
          $ref: common.yml#/components/responses/Forbidden
        '404':
          $ref: common.yml#/components/responses/NotFound
