        browsedPages: ["Users > All users"]
      x-nodoc-operation-context:
        surface: Users > All users
        availability:
          level: user-context
          notes:
            - Effective permission maps depend on the authenticated caller; they do not establish minimum API privileges.
        provenance:
          - source: authenticated-portal-capture-20261029
            confidence: high
            notes:
              - "Exact wire GET /api/Permissions returned HTTP 200 on reload action 2 at 2026-10-29T18:25:41.645Z; evidence request-0adec0070e3efad4ee87."
              - "Complete sanitized response privately hash-verified."
              - "allowedActions and ownerConditionalActions were non-empty objects mapping keys to arrays of strings. notApplicableActions was empty, so its value type remains unverified."
              - "Authorization and X-Ms-Client-Request-Id headers were observed. The historical partial example continues to suppress caller-specific privilege values; standalone token acquisition and least privilege were not tested."
      summary: Get current permissions
      description: >-
        Retrieve a summary of the effective permissions for the currently authenticated user.
      operationId: Permissions.Get
      tags: [Permissions]
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              $ref: common.yml#/components/headers/Cache-Control
            Content-Encoding:
              $ref: common.yml#/components/headers/Content-Encoding
            Vary:
