            Date:
              $ref: common.yml#/components/headers/Date
            Content-Length:
              $ref: common.yml#/components/headers/Content-Length
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowedActions:
                    type: object
                    description: Current observed values are arrays of strings; map contents are caller-specific.
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  ownerConditionalActions:
                    type: object
                    description: Current observed values are arrays of strings; map contents are caller-specific.
                    additionalProperties:
                      type: array
                      items:
                        type: string
                  notApplicableActions:
                    type: object
              x-nodoc-example-note: >-
                Historical 2026-10-03 redacted partial response example.
                Empty objects suppress effective privilege map values; they do
                not assert that the caller lacks permissions.
              example:
                allowedActions: {}
                ownerConditionalActions: {}
                notApplicableActions: {}
        4XX:
          $ref: common.yml#/components/responses/ClientException

