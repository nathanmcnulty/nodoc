openapi: 3.0.1
info:
  title: Entra IGA
  x-nodoc-category: Entra
  description: |
    The Entra IGA (Identity Governance and Administration) API is used by the Microsoft
    Entra portal (entra.microsoft.com → Identity Governance) for managing entitlement
    management and governance administration, including:

      - Entitlement Management (Access Packages, Catalogs, Policies)
      - Connected Organizations
      - Billing Configuration (Guest User Billing)
      - Governance Settings and Administration

    All endpoints are served from `elm.iga.azure.com` and require a valid
    Azure AD bearer token with Identity Governance permissions.

    **Note:** This specification was generated through browser traffic analysis of the
    Entra portal. Many Identity Governance features use Microsoft Graph APIs directly
    rather than this dedicated ELM API. This spec covers the non-Graph endpoints
    observed during portal interaction.

    Graph-backed Identity Governance features such as Lifecycle Workflows are
    intentionally excluded from this legacy ELM specification.

    Some endpoints may return 404 if the corresponding Entra ID Governance license
    feature has not been enabled for the tenant.
  version: 0.1.0
  contact:
    name: nodoc
    url: https://github.com/nathanmcnulty/nodoc
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://elm.iga.azure.com
    description: Entra Identity Governance Administration API
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Azure AD bearer token with Identity Governance permissions
  parameters:
    $filter:
      name: $filter
      in: query
      schema:
        type: string
      description: OData filter expression
    $top:
      name: $top
      in: query
      schema:
        type: integer
      description: Maximum number of results to return
    $skip:
      name: $skip
      in: query
      schema:
        type: integer
      description: Number of results to skip
    $count:
      name: $count
      in: query
      schema:
        type: boolean
      description: Include the total result count in the OData response
    $orderby:
      name: $orderby
      in: query
      schema:
        type: string
      description: OData order-by expression
    $expand:
      name: $expand
      in: query
      schema:
        type: string
      description: OData related-resource expansion expression
    $select:
      name: $select
      in: query
      schema:
        type: string
      description: OData response-property selection expression
tags:
  - name: Billing
    description: Guest user billing configuration
  - name: Entitlement Management
    description: Access package and catalog management
  - name: Connected Organizations
    description: External organization connections
  - name: Settings
    description: Identity Governance administration settings
x-tagGroups:
  - name: Governance administration
    tags: [Billing, Settings]
  - name: Entitlement management
    tags: [Entitlement Management, Connected Organizations]
externalDocs:
  description: Checked-in source specification and supporting modules.
  url: https://github.com/nathanmcnulty/nodoc/tree/main/specifications/nodoc-entra-iga/specification
paths:
  /api/v1/billingConfigurations/guestBilling:
    get:
      tags: [Billing]
      summary: Get guest billing configuration
      description: |
        Retrieves the guest user billing configuration for the tenant.
        Controls whether the tenant pays for guest user access to
        entitlement management resources.

        **Note:** Returns 404 if the guest billing feature has not been
        configured for the tenant.
      responses:
        '200':
          description: Guest billing configuration
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Guest billing not configured for this tenant
      x-nodoc-operation-context:
        surface: Historical portal caller / declared backend transport relationship
        provenance:
          - source: retained-adjacent-portal-transport-reviewed-20261030
            confidence: high
            notes:
              - Historical transport identity is exact GET elm.iga.azure.com/api/v1/billingConfigurations/guestBilling, canonical /api/v1/billingConfigurations/guestBilling under the currently declared backend specification entra-iga.
              - "Original caller capture assignments: entra-idgov, entra-pim. Caller page attribution and assignment labels do not by themselves establish causal execution of the backend owner's UI."
              - Retained entra-idgov-01 action 0 at 2026-10-29T19:01:37.322Z; evidence request-fa1fc1ca307601ff499c; HTTP 404.
              - Retained entra-pim-01 action 2 at 2026-10-29T19:29:33.830Z; evidence request-cd68a88ce34659605801; HTTP 404.
              - "Observed query parameter names: none recorded. Values and derived page-label strings are withheld; parameter presence is not requiredness testing."
              - This review used raw transport metadata only. No qualifying complete action-attributed response body was available in the selected retained evidence; bootstrap-only complete responses are excluded as action witnesses. Response/body/schema gaps remain open.
              - Existing response schemas are unchanged. Any newly listed status is description-only, with no inferred error body, status cause, route removal or availability conclusion.
              - Original dates/actions remain historical; this is not fresh capture, current tenant validation, business or application health, standalone invocation, role/grant/minimum-permission proof, or an owning-portal workflow test.
              - GET is the recorded method, not a safety or idempotence determination. No request was authored, invoked, probed or replayed by this offline review; effects and rollback are untested.
              - Confidence applies only to the verified historical method/host/path/status metadata. Captured values, identifiers, credentials, response fingerprints, body lengths and examples are withheld.
    put:
      tags: [Billing]
      summary: Update guest billing configuration
      description: |
        Updates the guest billing configuration for the tenant.

        **Warning:** This endpoint modifies billing configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Guest billing configuration updated
  /api/v1/accessPackageCatalogs:
    get:
      x-nodoc-live-capture:
        source: "Observe-only portal refresh 2026-10-29; Catalogs action 3; request-32f8062f4023aa4f4ab6 and request-75a2be8b894e7978d5e3; HTTP 200"
        browsedPages: ["Identity governance > Catalogs"]
      x-nodoc-operation-context:
        surface: Identity governance > Catalogs
        availability:
          level: tenant-conditional
          notes:
            - Catalog contents and projection-dependent fields vary by the current tenant and query.
        provenance:
          - source: authenticated-portal-capture-20261029
            confidence: high
            notes:
              - "Two exact GET /api/v1/accessPackageCatalogs requests returned HTTP 200 at action 3: list ordering/count and projection/expansion variants, each with a nonempty value array of objects."
              - "List variant request-75a2be8b894e7978d5e3 at 2026-10-29T19:14:11.679Z: complete response privately hash-verified; query names $count, $orderby and $top."
              - "Projection variant request-32f8062f4023aa4f4ab6 at 2026-10-29T19:14:12.254Z: complete response privately hash-verified; query names $expand, $filter and $select."
              - "Full-list fields corroborate the added optional property types. uniqueName and serviceManagementReference were null-only, so their non-null types remain unverified. Projection id/additionalInfo types remain compatible."
              - "Authorization and client-context headers were present in portal requests; header/parameter requiredness, standalone authentication, tenant grants and least privilege were not tested. No catalog, identity, action, scope or privilege values are copied."
              - "Current observations cover these exact operations and states only; Graph-backed Lifecycle Workflows and other Graph-host traffic remain outside this legacy ELM specification."
      tags: [Entitlement Management]
      summary: List access package catalog summaries
      description: |
        Retrieves catalog records used by the entitlement-management portal.
        List-ordering queries can return descriptive and lifecycle fields with
        an OData count; projection/expansion queries can return identifiers and
        aggregate access-package/resource counts in additionalInfo.
      parameters:
        - $ref: '#/components/parameters/$count'
        - $ref: '#/components/parameters/$orderby'
        - $ref: '#/components/parameters/$top'
        - $ref: '#/components/parameters/$expand'
        - $ref: '#/components/parameters/$filter'
        - $ref: '#/components/parameters/$select'
      responses:
        '200':
          description: Access package catalog summaries
          content:
            application/json:
              schema:
                type: object
                properties:
                  '@odata.context':
                    type: string
                  '@odata.count':
                    type: number
                  value:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        displayName:
                          type: string
                        uniqueName:
                          nullable: true
                          description: Non-null value type remains unverified.
                        description:
                          type: string
                        catalogType:
                          type: string
                        catalogStatus:
                          type: string
                        state:
                          type: string
                        isExternallyVisible:
                          type: boolean
                        createdBy:
                          type: string
                        createdByString:
                          type: string
                        createdDateTime:
                          type: string
                        modifiedBy:
                          type: string
                        lastModifiedByString:
                          type: string
                        modifiedDateTime:
                          type: string
                        lastModifiedDateTime:
                          type: string
                        privilegeLevel:
                          type: string
                        serviceManagementReference:
                          nullable: true
                          description: Non-null value type remains unverified.
                        additionalInfo:
                          type: object
                          properties:
                            catalogId:
                              type: string
                            accessPackageCount:
                              type: number
                            resourceCount:
                              type: number
  /api/v1/checkAccess:
    post:
      x-nodoc-live-capture:
        source: "Observe-only portal refresh 2026-10-29; Connected organizations action 6; request-c3f6c9e6cd7b6de03934; HTTP 200"
        browsedPages: ["Identity governance > Connected organizations"]
      x-nodoc-operation-context:
        surface: Identity governance > Connected organizations
        availability:
          level: request-dependent
          notes:
            - Authorization results depend on the current caller and request scope; the result does not establish minimum roles.
        provenance:
          - source: authenticated-portal-capture-20261029
            confidence: high
            notes:
              - "Exact POST /api/v1/checkAccess was emitted passively at action 6 on 2026-10-29T19:15:12.432Z; complete response privately hash-verified."
              - "The response contained @odata.context string and value boolean; the request contained action and resourceScope strings. Caller-specific values are not copied."
              - "No authored request, replay, mutation, side-effect validation or standalone POST safety test occurred; the existing replay prohibition remains applicable."
              - "Authorization and client-context headers were present in portal requests; header/parameter requiredness, standalone authentication, tenant grants and least privilege were not tested. No catalog, identity, action, scope or privilege values are copied."
              - "Current observations cover these exact operations and states only; Graph-backed Lifecycle Workflows and other Graph-host traffic remain outside this legacy ELM specification."
      tags: [Entitlement Management]
      summary: Check authorization for an entitlement-management action
      description: |
        Evaluates whether the caller is authorized for the supplied action and
        resource scope. This is a read-like authorization check; it does not
        perform the action named in the request.

        **Safety:** This operation was observed passively during a normal portal
        page load. Do not probe or replay it, alter the action or resource scope,
        or treat it as a write-safe test route.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                resourceScope:
                  type: string
      responses:
        '200':
          description: Authorization-check result
          content:
            application/json:
              schema:
                type: object
                properties:
                  '@odata.context':
                    type: string
                  value:
                    type: boolean
  /api/v1/accessPackages:
    get:
      tags: [Entitlement Management]
      summary: List access packages
      description: |
        Retrieves access packages managed through the ELM service.
        Access packages bundle resources with policies that govern
        who can request access and for how long.
      parameters:
        - $ref: '#/components/parameters/$filter'
        - $ref: '#/components/parameters/$top'
        - $ref: '#/components/parameters/$skip'
      responses:
        '200':
          description: List of access packages
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      type: object
              example:
                value:
                  - id: 0e69f959-bc56-4bf0-bf0a-20b9d674e9dc
                    displayName: Contractors - CRM
                    description: Temporary CRM access for external contractors.
                    catalogId: 5a501947-3f03-4f4a-b3fb-6d7f9c7656d5
  /api/v1/accessPackages/{accessPackageId}:
    get:
      tags: [Entitlement Management]
      summary: Get a specific access package
      parameters:
        - name: accessPackageId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Access package details
  /api/v1/catalogs:
    get:
      tags: [Entitlement Management]
      summary: List catalogs
      description: |
        Retrieves entitlement management catalogs. Catalogs are containers
        for access packages and their associated resources and policies.
      parameters:
        - $ref: '#/components/parameters/$filter'
        - $ref: '#/components/parameters/$top'
      responses:
        '200':
          description: List of catalogs
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      type: object
              example:
                value:
                  - id: 5a501947-3f03-4f4a-b3fb-6d7f9c7656d5
                    displayName: External collaboration
                    description: Catalog for guest and partner access packages.
  /api/v1/catalogs/{catalogId}:
    get:
      tags: [Entitlement Management]
      summary: Get a specific catalog
      parameters:
        - name: catalogId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Catalog details
  /api/v1/catalogs/{catalogId}/resources:
    get:
      tags: [Entitlement Management]
      summary: List resources in a catalog
      description: |
        Retrieves the resources (groups, applications, SharePoint sites)
        contained in a specific catalog.
      parameters:
        - name: catalogId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/$filter'
        - $ref: '#/components/parameters/$top'
      responses:
        '200':
          description: List of catalog resources
  /api/v1/connectedOrganizations:
    get:
      tags: [Connected Organizations]
      summary: List connected organizations
      description: |
        Retrieves the list of connected organizations. Connected organizations
        represent external organizations whose users can request access to
        your entitlement management resources.
      parameters:
        - $ref: '#/components/parameters/$filter'
        - $ref: '#/components/parameters/$top'
      responses:
        '200':
          description: List of connected organizations
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      type: object
              example:
                value:
                  - id: 9d08f505-242b-4a80-9170-2644d4412b17
                    displayName: Fabrikam
                    description: Partner organization approved for entitlement requests.
  /api/v1/connectedOrganizations/{connectedOrganizationId}:
    get:
      tags: [Connected Organizations]
      summary: Get a specific connected organization
      parameters:
        - name: connectedOrganizationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Connected organization details
  /api/v1/settings:
    get:
      tags: [Settings]
      summary: Get Identity Governance settings
      description: |
        Retrieves the global Identity Governance settings for the tenant,
        including entitlement management configuration and default policies.
      responses:
        '200':
          description: Identity Governance settings
          content:
            application/json:
              schema:
                type: object
    patch:
      tags: [Settings]
      summary: Update Identity Governance settings
      description: |
        Updates the global Identity Governance settings.

        **Warning:** This endpoint modifies tenant-level governance settings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Settings updated
