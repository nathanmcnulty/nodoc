openapi: 3.0.1
info:
  title: M365 Apps Inventory
  x-nodoc-category: M365 Apps
  description: |
    The M365 Apps Inventory API is used by the Microsoft 365 Apps admin center
    to query device inventory, build summaries, add-ins, setup state, and
    security update currency from `query.inventory.insights.office.net`.

    This surface was observed while browsing:

      - Home and Cloud Update
      - Inventory
      - Security Update Status
      - Setup

    Requests use portal-issued bearer tokens together with diagnostic headers such
    as `x-api-name`, `x-correlationid`, `x-manageoffice-client-sid`, and
    `x-requested-with`. Most observed requests specify `api-version=1.1` and
    accept OData-style query options.

    A second pass with token-backed probes confirmed additional inventory
    families including Languages, OfficeApplications, OfficeAddinVersions,
    Onboarding, `GetLatestSecurityReleasesPerServicingChannel`, and the
    `SecurityVulnerabilities` endpoints. Intercepted save flows also exposed the
    request bodies used by Setup (`POST /inventory/api/Settings`) and Security
    Update Status (`POST /inventory/api/SecurityCurrencyGoal`).

    An export route was observed during read-only list/detail replay, but
    `Device` and `OfficeAddin` requests returned `Object Not Found`. It remains
    intentionally undocumented because export/job routes require separate safety
    review. The configured but still-unlit host `health.insights.office.net`
    remains a bundle discovery that was not exercised in the current tenant.

    Documentation and specifications have been provided on a best-efforts basis and
    may not be 100% accurate.
  version: 0.1.0
  contact:
    name: nodoc
    url: https://github.com/nathanmcnulty/nodoc
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://query.inventory.insights.office.net
    description: M365 Apps inventory and health data API
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Portal-issued bearer token used by the M365 Apps admin center inventory
        experiences. Observed requests also include portal diagnostic headers
        such as `x-api-name`, `x-correlationid`, `x-manageoffice-client-sid`,
        and `x-requested-with`.
  parameters:
    apiVersion:
      name: api-version
      in: query
      required: true
      description: Observed inventory API version.
      schema:
        type: string
        example: '1.1'
    goalId:
      name: goalId
      in: path
      required: true
      description: Security currency goal identifier.
      schema:
        type: string
        format: uuid
    settingsId:
      name: settingsId
      in: path
      required: true
      description: Inventory settings identifier.
      schema:
        type: string
        format: uuid
    select:
      name: $select
      in: query
      description: OData projection expression.
      schema:
        type: string
    expand:
      name: $expand
      in: query
      description: OData expand expression.
      schema:
        type: string
    filter:
      name: $filter
      in: query
      description: OData filter expression.
      schema:
        type: string
    top:
      name: $top
      in: query
      description: Maximum number of results to return.
      schema:
        type: integer
    skip:
      name: $skip
      in: query
      description: Number of results to skip.
      schema:
        type: integer
    count:
      name: $count
      in: query
      description: Whether to include a count in the response.
      schema:
        type: boolean
    orderby:
      name: $orderby
      in: query
      description: OData sort expression.
      schema:
        type: string
    cloudManagement:
      name: cloudManagement
      in: query
      description: Comma-separated cloud management modes to include.
      schema:
        type: string
    enableChannelManagement:
      name: enableChannelManagement
      in: query
      description: Whether channel management data should be included.
      schema:
        type: boolean
    mecVersion:
      name: mecVersion
      in: query
      description: Monthly Enterprise build version used in update progress calculations.
      schema:
        type: string
    ccVersion:
      name: ccVersion
      in: query
      description: Current Channel build version used in update progress calculations.
      schema:
        type: string
    saecVersion:
      name: saecVersion
      in: query
      description: Semi-Annual Enterprise Channel build version used in update progress calculations.
      schema:
        type: string
  schemas:
    GenericObject:
      type: object
      additionalProperties: true
    InventoryCollection:
      type: object
      description: Generic OData-style collection returned by inventory endpoints.
      properties:
        '@odata.context':
          type: string
        '@odata.count':
          type: integer
        value:
          type: array
          items:
            $ref: '#/components/schemas/GenericObject'
      required:
        - '@odata.context'
        - value
    DeviceUpdateStatusSummary:
      type: object
      properties:
        updateStatus:
          type: string
        numberOfDevices:
          type: integer
      required:
        - updateStatus
        - numberOfDevices
    DeviceUpdateProgressChannelSummary:
      type: object
      properties:
        targetChannel:
          type: string
        updateStatusSummary:
          type: array
          items:
            $ref: '#/components/schemas/DeviceUpdateStatusSummary'
      required:
        - targetChannel
        - updateStatusSummary
    DeviceUpdateProgressSummaryResponse:
      type: object
      properties:
        '@odata.context':
          type: string
        totalNumberOfDevices:
          type: integer
        summary:
          type: array
          items:
            $ref: '#/components/schemas/DeviceUpdateProgressChannelSummary'
      required:
        - '@odata.context'
        - totalNumberOfDevices
        - summary
    DeviceSummary:
      type: object
      properties:
        '@odata.context':
          type: string
        totalDevices:
          type: integer
        officeArchitectureCounts:
          type: array
          items:
            $ref: '#/components/schemas/OfficeArchitectureCount'
      required:
        - '@odata.context'
        - totalDevices
        - officeArchitectureCounts
    OfficeArchitectureCount:
      type: object
      description: |
        Architecture rollup item observed with this stable key and type shape in
        six successful read-only responses captured on 2026-08-10. The retained
        evidence does not establish stronger nullability or required-field rules.
      properties:
        officeArchitecture:
          type: string
          nullable: true
        count:
          type: integer
          nullable: true
    LatestPatchDate:
      type: object
      properties:
        '@odata.context':
          type: string
        latestPatchDate:
          type: string
          format: date-time
        latestPatchDateKnown:
          type: boolean
      required:
        - '@odata.context'
        - latestPatchDate
        - latestPatchDateKnown
    SecurityRelease:
      type: object
      properties:
        officeServicingChannel:
          type: string
        releaseType:
          type: string
        buildVersion:
          type: string
        releaseVersion:
          type: string
        availabilityDate:
          type: string
          format: date-time
        endOfSupportDate:
          type: string
          format: date-time
        cveIds:
          type: array
          items:
            type: string
      additionalProperties: true
    SecurityReleaseCollection:
      type: object
      properties:
        '@odata.context':
          type: string
        '@odata.count':
          type: integer
        value:
          type: array
          items:
            $ref: '#/components/schemas/SecurityRelease'
      required:
        - '@odata.context'
        - value
    SecurityCurrencyMetrics:
      type: object
      properties:
        '@odata.context':
          type: string
        securityCurrencyDevicesWithAppsTotal:
          type: integer
        securityCurrencyUpToDateDevicesTotal:
          type: integer
        securityCurrencyNotUpToDateDevicesTotal:
          type: integer
        securityCurrencyUnknownStatusDevicesTotal:
          type: integer
      required:
        - '@odata.context'
        - securityCurrencyDevicesWithAppsTotal
        - securityCurrencyUpToDateDevicesTotal
        - securityCurrencyNotUpToDateDevicesTotal
        - securityCurrencyUnknownStatusDevicesTotal
    SecurityCurrencyGoal:
      type: object
      properties:
        securityCurrencyGoalId:
          type: string
          format: uuid
        securityCurrencyGoalTimeInDays:
          type: integer
          minimum: 0
          maximum: 30
        securityCurrencyGoalPercentage:
          type: integer
          minimum: 0
          maximum: 100
      required:
        - securityCurrencyGoalId
        - securityCurrencyGoalTimeInDays
        - securityCurrencyGoalPercentage
    SecurityCurrencyGoalUpdate:
      type: object
      properties:
        securityCurrencyGoalTimeInDays:
          type: integer
          minimum: 0
          maximum: 30
        securityCurrencyGoalPercentage:
          type: integer
          minimum: 0
          maximum: 100
      required:
        - securityCurrencyGoalTimeInDays
        - securityCurrencyGoalPercentage
    InventorySettings:
      type: object
      properties:
        '@odata.context':
          type: string
        settingsId:
          type: string
          format: uuid
        deviceRetentionInDays:
          type: integer
        deviceInactiveThresholdInDays:
          type: integer
          nullable: true
      required:
        - '@odata.context'
        - settingsId
        - deviceRetentionInDays
    InventorySettingsUpdateRequest:
      type: object
      properties:
        settingsId:
          type: string
          format: uuid
        deviceRetentionInDays:
          type: integer
          minimum: 30
          maximum: 180
        deviceInactiveThresholdInDays:
          type: integer
          nullable: true
      required:
        - settingsId
        - deviceRetentionInDays
    InventorySettingsDeltaRequest:
      type: object
      properties:
        deviceRetentionInDays:
          type: integer
          minimum: 30
          maximum: 180
        deviceInactiveThresholdInDays:
          type: integer
          nullable: true
      required:
        - deviceRetentionInDays
    OnboardingState:
      type: object
      properties:
        '@odata.context':
          type: string
        onboardingLink:
          type: string
        onboardingStatus:
          type: string
      required:
        - '@odata.context'
        - onboardingLink
        - onboardingStatus
    PlainInteger:
      type: integer
tags:
  - name: Devices
    description: Inventory queries for device counts, build summaries, and add-in rollups.
  - name: Onboarding
    description: Inventory onboarding and offboarding operations exposed on setup-enabled tenants.
  - name: Update Progress
    description: Cloud Update progress calculations by servicing channel.
  - name: Security Currency
    description: Security update status and latest patch posture used by the health page.
  - name: Security Vulnerabilities
    description: Vulnerability rollups and device lists lit by hidden security experiences.
  - name: Settings
    description: Inventory and setup settings exposed through the inventory service.
x-tagGroups:
  - name: Inventory & onboarding
    tags: [Devices, Onboarding, Settings]
  - name: Updates
    tags: [Update Progress]
  - name: Security
    tags: [Security Currency, Security Vulnerabilities]
