            confidence: high
            notes:
              - Historical transport identity is exact GET query.inventory.insights.office.net/inventory/api/Devices, canonical /inventory/api/Devices under the currently declared backend specification m365-apps-inventory.
              - "Original caller capture assignments: m365-apps-config. Caller page attribution and assignment labels do not by themselves establish causal execution of the backend owner's UI."
