              - "The observed collection envelopes contained empty value arrays. Existing InventoryCollection root types and required properties were compatible; no device-item field types, requiredness, examples, enums or formats follow from these empty arrays, and the response schema is unchanged."
              - "Captured at 2026-10-31T07:32:37.340Z; action-attributed evidence request-414777251387074d4f7c. Earlier transport-only provenance remains historical; its missing-body statement does not describe this later bounded capture."
              - "Observed query parameter names: $count, $filter, $top, api-version. Values are withheld; parameter presence does not establish requiredness or filter semantics."
              - "This is caller/backend transport and collection-envelope evidence, not native backend-portal workflow, business health, entitlement, grant, minimum-role, specific-tenant or standalone-invocation proof. No authored API request or probe was used; passive background effects and absence of tenant changes were not determined."
              - "Captured values, identifiers, credentials, raw examples, response fingerprints and body lengths are withheld. Remaining item-schema and broader usage/freshness questions remain open."
