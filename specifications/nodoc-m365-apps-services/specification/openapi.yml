  /onboarding/odata/v1.0/FeatureData:
    get:
      operationId: M365AppsServices.ListFeatureDefinitions
      tags: [Onboarding]
      summary: List feature definitions
      description: Returns feature metadata, ring assignments, and eligibility requirements used by the portal.
      x-nodoc-operation-context:
        surface: Microsoft 365 Apps admin center onboarding
        workflows:
          - Discover service feature definitions, rings, agreements, and eligibility requirements before rendering setup choices.
        permissions:
          - Requires the browser-obtained Microsoft 365 Apps services bearer token.
        pagination:
          style: odata
          responseFields:
            - value
          notes:
            - No continuation field was observed in the captured response.
        availability:
          level: tenant-conditional
        troubleshooting:
          - Feature and ring names are service-controlled and may change independently of the response envelope.
        provenance:
          - source: authenticated-portal-capture
            confidence: high
          - source: live-authenticated-capture
            confidence: high
            notes:
              - GET clients.config.office.net/onboarding/odata/v1.0/FeatureData; HTTP 200; action 12; observed 2026-10-29T21:46:37.970Z; complete response privately hash-verified.
              - Current declared root and populated-item field types match the existing schema; feature names, eligibility identifiers and state values are not reproduced.
              - Observed HTTP and response behavior does not establish product activation, feature entitlement, tenant grants, minimum roles or standalone execution.
      responses:
        '200':
          description: Feature definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureDataResponse'
  /onboarding/odata/v1.0/FeatureProvisiondata:
    get:
      operationId: M365AppsServices.GetFeatureProvisioningState
      tags: [Onboarding]
      summary: Query feature provisioning state
      description: Returns provisioning state for one or more features, typically scoped with an OData filter.
      x-nodoc-operation-context:
        surface: Microsoft 365 Apps admin center setup and provisioning
        workflows:
          - Read the current provisioning and migration state for one or more shared-service features.
        permissions:
          - Requires the browser-obtained Microsoft 365 Apps services bearer token.
        pagination:
          style: odata
          requestParameters:
            - $filter
          responseFields:
            - value
        availability:
          level: feature-gated
        troubleshooting:
          - Distinguish an empty value array from a provisioning failure or authorization error.
        provenance:
          - source: authenticated-portal-capture
            confidence: high
          - source: live-authenticated-capture
            confidence: high
            notes:
              - GET clients.config.office.net/onboarding/odata/v1.0/FeatureProvisiondata; HTTP 200; action 12; observed 2026-10-29T21:46:37.970Z; complete response privately hash-verified.
              - Current declared root and populated-item field types match the existing schema; feature names, eligibility identifiers and state values are not reproduced.
              - Observed HTTP and response behavior does not establish product activation, feature entitlement, tenant grants, minimum roles or standalone execution.
      parameters:
        - $ref: '#/components/parameters/featureFilter'
      responses:
        '200':
          description: Feature provisioning state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureProvisionResponse'
              examples:
                syntheticRefresh:
                  summary: Synthetic values illustrating an observed response shape; not a captured response.
                  description: Based on passive portal observation 2026-10-29T21:46:20.274Z, evidence request-508b29b942f29519efb0. Scalar values are synthesized; this example illustrates one observed shape.
                  value:
                    "@odata.context": example
                    value:
                      - featureMigrationStatus: example
                        featureName: example
                        featureProvisionStatus: example
    post:
      operationId: M365AppsServices.ProvisionFeature
      tags: [Onboarding]
      summary: Provision or confirm a feature state
      description: |
        Observed as a body-less POST that returns an OData boolean wrapper.
        Treat this as a potentially state-changing provisioning call.
      x-nodoc-operation-context:
        surface: Microsoft 365 Apps admin center setup and provisioning
        workflows:
          - Provision or confirm a tenant feature selected through the portal setup experience.
        permissions:
          - Requires a portal bearer token and sufficient tenant administration permission to provision the selected feature.
        availability:
          level: feature-gated
        troubleshooting:
          - Do not invoke this operation for discovery unless an exact approved reversible-operation plan exists; a body-less request is still potentially state-changing.
          - Read the GET provisioning state before and after any authorized invocation and preserve the exact feature filter and response evidence.
        provenance:
          - source: authenticated-portal-capture
            confidence: high
      responses:
        '200':
          description: Provisioning completed or already satisfied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ODataBooleanResponse'
  /releases/v1.0/OfficeReleases:
    get:
      operationId: M365AppsServices.GetOfficeReleaseCatalog
      tags: [Release Catalog]
      summary: Get Office release catalog
      description: Returns the release catalog used by Device Configuration and release-selection experiences.
      x-nodoc-operation-context:
        surface: Microsoft 365 Apps admin center Device Configuration
        workflows:
          - Populate Office release-channel and build selectors with availability and end-of-support dates.
        permissions:
          - Requires the browser-obtained Microsoft 365 Apps services bearer token.
        pagination:
          style: none
        availability:
          level: global
          notes:
            - The catalog is service-controlled even though access still requires the portal authentication context.
        troubleshooting:
          - Channel aliases, versions, and CDN URLs change over time; consume them as catalog data rather than hard-coded constants.
        provenance:
          - source: authenticated-portal-capture
            confidence: high
      responses:
        '200':
          description: Release catalog by servicing channel
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OfficeReleaseChannel'
