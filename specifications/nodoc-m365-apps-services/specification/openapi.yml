openapi: 3.0.1
info:
  title: M365 Apps Services
  x-nodoc-category: M365 Apps
  description: |
    The M365 Apps Services API is used by the Microsoft 365 Apps admin center
    to query onboarding state, feature availability, release catalogs, component
    sharding, and OneDrive Sync health telemetry from `clients.config.office.net`.

    This surface was observed while browsing:

      - Home and Cloud Update
      - Device Configuration
      - OneDrive Sync
      - Setup

    Requests are issued from the portal with bearer tokens and diagnostic headers
    such as `x-api-name`, `x-correlationid`, `x-manageoffice-client-sid`, and
    `x-requested-with`.

    Static bundle analysis also exposed related or preview hosts including
    `canary.clients.config.office.net` and `sip.clients.config.office.net`,
    but the operations below were the concrete requests observed in the current
    tenant.

    Documentation and specifications have been provided on a best-efforts basis and
    may not be 100% accurate.
  version: 0.2.0
  contact:
    name: nodoc
    url: https://github.com/nathanmcnulty/nodoc
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://clients.config.office.net
    description: M365 Apps shared services API
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Browser-obtained bearer token used by the M365 Apps admin center.
        Observed requests also include portal diagnostic headers such as
        `x-api-name`, `x-correlationid`, `x-manageoffice-client-sid`, and
        `x-requested-with`.
  parameters:
    featureFilter:
      name: $filter
      in: query
      description: OData filter used to scope onboarding, agreement, or feature provisioning records.
      schema:
        type: string
  schemas:
    GenericObject:
      type: object
      additionalProperties: true
    AgreementResponse:
      type: object
      properties:
        '@odata.context':
          type: string
        value:
          type: array
          items:
            $ref: '#/components/schemas/GenericObject'
      required:
        - '@odata.context'
        - value
    EligibilityRecord:
      type: object
      properties:
        '@odata.context':
          type: string
        id:
          type: string
          format: uuid
        eligibilities:
          type: array
          items:
            type: string
      required:
        - '@odata.context'
        - id
        - eligibilities
    FeatureDefinition:
      type: object
      properties:
        featureName:
          type: string
        featureRing:
          type: string
        featureRingAgreementVersion:
          type: string
        learningConsent:
          type: string
        learningConsentAgreementVersion:
          type: string
        eligibilityRequirement:
          type: string
      additionalProperties: true
    FeatureDataResponse:
      type: object
      properties:
        '@odata.context':
          type: string
        value:
          type: array
          items:
            $ref: '#/components/schemas/FeatureDefinition'
      required:
        - '@odata.context'
        - value
      x-nodoc-example-note: >-
        Type-only redacted representative from the completed 2026-08-10 capture.
        Each REDACTED_STRING token preserves an observed string field and is
        neither a literal tenant or service value nor an enum claim.
      example:
        '@odata.context': REDACTED_STRING
        value:
          - featureName: REDACTED_STRING
            featureRing: REDACTED_STRING
            featureRingAgreementVersion: REDACTED_STRING
            learningConsent: REDACTED_STRING
            learningConsentAgreementVersion: REDACTED_STRING
            eligibilityRequirement: REDACTED_STRING
    FeatureProvisionRecord:
      type: object
      properties:
        featureName:
          type: string
        featureProvisionStatus:
          type: string
        featureMigrationStatus:
          type: string
      additionalProperties: true
    FeatureProvisionResponse:
      type: object
      properties:
        '@odata.context':
          type: string
        value:
          type: array
          items:
            $ref: '#/components/schemas/FeatureProvisionRecord'
      required:
        - '@odata.context'
        - value
    ODataBooleanResponse:
      type: object
      properties:
        '@odata.context':
          type: string
        value:
          type: boolean
      required:
        - '@odata.context'
        - value
    OneDriveSyncCountRequest:
      type: array
      description: Array of filter expressions used to request multiple OneDrive Sync counters in one call.
      items:
        type: string
    IndexedCountMap:
      type: object
      description: Response keyed by request filter index.
      additionalProperties:
        type: integer
    OneDriveVersionCount:
      type: object
      properties:
        updateRing:
          type: integer
        currentOneDriveVersion:
          type: string
        newerCount:
          type: integer
        currentCount:
          type: integer
        olderCount:
          type: integer
        oneDrivePlatformType:
          type: integer
      additionalProperties: true
    OfficeVersion:
      type: object
      properties:
        legacyVersion:
          type: string
        releaseVersion:
          type: string
        buildVersion:
          type: string
        availabilityDate:
          type: string
          format: date-time
        endOfSupportDate:
          type: string
          format: date-time
        cdnBaseUrl:
          type: string
          format: uri
      additionalProperties: true
    OfficeReleaseChannel:
      type: object
      properties:
        channel:
          type: string
        channelId:
          type: string
        alternateNames:
          type: array
          items:
            type: string
        latestVersion:
          type: string
        officeVersions:
          type: array
          items:
            $ref: '#/components/schemas/OfficeVersion'
      additionalProperties: true
tags:
  - name: Intents
    description: Component-sharding and portal bootstrap calls.
  - name: Onboarding
    description: Feature discovery, eligibility, and provisioning helpers.
  - name: OneDrive Sync
    description: OneDrive Sync telemetry and version distribution used by the health page.
  - name: Release Catalog
    description: Office release catalog used by Device Configuration and related UX.
x-tagGroups:
  - name: Portal foundation
    tags: [Intents, Onboarding]
  - name: Update & sync services
    tags: [Release Catalog, OneDrive Sync]
externalDocs:
  description: Checked-in source specification and supporting modules.
  url: https://github.com/nathanmcnulty/nodoc/tree/main/specifications/nodoc-m365-apps-services/specification
paths:
  /intents/v1.0/ComponentGroupIntentShard:
    post:
      operationId: M365AppsServices.ResolveComponentGroupIntentShard
      tags: [Intents]
      summary: Resolve component group shard
      description: |
        Resolves or initializes the component-group shard used by the portal shell.
        Observed as a body-less POST returning a boolean.
      x-nodoc-operation-context:
        surface: Microsoft 365 Apps admin center shell bootstrap
        workflows:
          - Resolve the service shard used by the portal before loading feature-specific experiences.
        permissions:
          - Requires the browser-obtained Microsoft 365 Apps services bearer token used by config.office.com.
        availability:
          level: tenant-conditional
          notes:
            - The returned boolean reflects whether shard resolution is available for the current tenant context.
        troubleshooting:
          - Preserve x-api-name, correlation, client-session, and requested-with headers when reproducing portal behavior.
          - Although the response is a boolean, the body-less POST may initialize service-side routing and should not be treated as a generic safe probe.
        provenance:
          - source: authenticated-portal-capture
            confidence: high
          - source: retained-native-portal-evidence-reviewed-20261030
            confidence: high
            notes:
              - Exact declared POST clients.config.office.net/intents/v1.0/ComponentGroupIntentShard maps to canonical /intents/v1.0/ComponentGroupIntentShard; current declared server/base/path and original request binding were checked privately.
              - Retained m365-apps-services-01 action 0 at 2026-10-29T21:45:26.897Z; evidence request-fd32220d510996b31614; HTTP 200 complete body privately verified.
              - Original capture dates and action attribution are retained. Reusing these bodies for offline review does not create a fresh native observation or clear any historical run-level accounting gaps.
              - HTTP 200, complete body bytes and limited type checks do not establish application/business success, feature availability, entitlement, provisioning, effective permissions or minimum roles.
              - This POST was passively observed during the original portal capture, not authored, invoked, probed or replayed by this review. Request shape remains unknown because no complete verified request sidecar is available; replay safety, idempotence, effects and rollback are unproven.
              - Captured scalar values, role/feature-map keys, credentials, tenant data, response fingerprints, byte lengths and examples are withheld. No new route or requiredness, enum, format, authentication or standalone execution claim follows.
      responses:
        '200':
          description: Shard resolution succeeded
          content:
            application/json:
              schema:
                type: boolean
              example: true
  /odbhealth/v1.0/synchealth/reports/count:
    post:
      operationId: M365AppsServices.GetOneDriveSyncBucketCounts
      tags: [OneDrive Sync]
      summary: Get OneDrive Sync bucket counts
      description: |
        Returns counts for multiple OneDrive Sync report filters in a single request.
        The request body is an array of filter expressions, and the response is keyed
        by filter index.
      x-nodoc-operation-context:
        surface: Microsoft 365 Apps admin center OneDrive Sync health
        workflows:
          - Populate OneDrive Sync health summary counters for multiple filters in one read-like POST.
        permissions:
          - Requires the portal bearer token and tenant access to OneDrive Sync health reporting.
        requestShapes:
          - name: ordered-filter-array
            contentType: application/json
            bodyKind: array
            notes: Response keys correspond to the zero-based position of each filter expression.
        availability:
          level: feature-gated
          notes:
            - Data is available only when OneDrive Sync health reporting is enabled and populated for the tenant.
        troubleshooting:
          - An empty result can reflect an unpopulated reporting surface rather than route removal.
          - Keep the filter array order stable when correlating response keys to requested counters.
        provenance:
          - source: authenticated-portal-capture
            confidence: high
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OneDriveSyncCountRequest'
      responses:
        '200':
          description: Count results by filter index
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexedCountMap'
  /odbhealth/v1.0/synchealth/reports/versioncount:
    get:
      operationId: M365AppsServices.GetOneDriveSyncVersionDistribution
      tags: [OneDrive Sync]
      summary: Get OneDrive Sync version distribution
      description: Returns OneDrive Sync client version distribution grouped by update ring and platform type.
      x-nodoc-operation-context:
        surface: Microsoft 365 Apps admin center OneDrive Sync health
        workflows:
          - Build the OneDrive client-version and update-ring distribution shown on the Sync health page.
        permissions:
          - Requires the portal bearer token and tenant access to OneDrive Sync health reporting.
        pagination:
          style: none
        availability:
          level: feature-gated
          notes:
            - The array may be empty when no eligible devices have reported sync-health telemetry.
        troubleshooting:
          - Treat an empty 200 response separately from authentication failures and service errors.
        provenance:
          - source: authenticated-portal-capture
            confidence: high
          - source: live-authenticated-capture
            confidence: high
            notes:
              - GET clients.config.office.net/odbhealth/v1.0/synchealth/reports/versioncount; HTTP 200; action 3; observed 2026-10-29T21:45:45.458Z; complete response privately hash-verified.
              - Current declared root and populated-item field types match the existing schema; feature names, eligibility identifiers and state values are not reproduced.
              - Observed HTTP and response behavior does not establish product activation, feature entitlement, tenant grants, minimum roles or standalone execution.
      responses:
        '200':
          description: Version distribution
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OneDriveVersionCount'
  /onboarding/odata/v1.0/EligibilityRecord:
    get:
      operationId: M365AppsServices.GetEligibilityRecord
      tags: [Onboarding]
      summary: Get onboarding eligibility record
      description: Returns the tenant eligibility record that gates M365 Apps admin center features.
      x-nodoc-operation-context:
        surface: Microsoft 365 Apps admin center onboarding
        workflows:
          - Determine which shared-service experiences the current tenant is eligible to use.
        permissions:
          - Requires the browser-obtained Microsoft 365 Apps services bearer token.
        pagination:
          style: none
        availability:
          level: tenant-conditional
        troubleshooting:
          - Use the eligibilities array as a capability signal; do not infer route removal when a feature is absent.
        provenance:
          - source: authenticated-portal-capture
            confidence: high
          - source: live-authenticated-capture
            confidence: high
            notes:
              - GET clients.config.office.net/onboarding/odata/v1.0/EligibilityRecord; HTTP 200; action 12; observed 2026-10-29T21:46:37.970Z; complete response privately hash-verified.
              - Current declared root and populated-item field types match the existing schema; feature names, eligibility identifiers and state values are not reproduced.
              - Observed HTTP and response behavior does not establish product activation, feature entitlement, tenant grants, minimum roles or standalone execution.
      responses:
        '200':
          description: Eligibility record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EligibilityRecord'
  /onboarding/odata/v1.0/Agreementdata:
    get:
      operationId: M365AppsServices.ListAgreementData
      tags: [Onboarding]
      summary: List feature-ring agreement records
      description: |
        Returns agreement records that gate preview or ring-based onboarding
        experiences. The observed live request filtered the collection with
        `$filter=FeatureRing eq 'Preview'` and returned an empty `value` array
        for the current tenant.
      x-nodoc-operation-context:
        surface: Microsoft 365 Apps admin center onboarding and preview agreements
        workflows:
          - Check whether the tenant has agreement records for a requested feature ring.
        permissions:
          - Requires the browser-obtained Microsoft 365 Apps services bearer token.
        variants:
          - selector: $filter
            location: query
            knownValues:
              - FeatureRing eq 'Preview'
            notes: The observed preview query returned a successful empty collection in the captured tenant.
        pagination:
          style: odata
          requestParameters:
            - $filter
          responseFields:
            - value
          notes:
            - No continuation field was observed; preserve any future OData next-link evidence if the collection grows.
        availability:
          level: tenant-conditional
        troubleshooting:
          - A 200 response with an empty value array is valid tenant state, not evidence that the endpoint was removed.
        provenance:
          - source: authenticated-portal-capture
            confidence: high
          - source: retained-adjacent-portal-transport-reviewed-20261030
            confidence: high
            notes:
