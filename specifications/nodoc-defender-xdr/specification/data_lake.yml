paths:
  /securityplatform/graphs/graph-instances:
    get:
      summary: List security graph instances
      description: >-
        Retrieve the graph instances available to the Defender security graph
        experience. The captured tenant returned an empty collection.
      operationId: DataLake.ListGraphInstances
      tags: [Data Lake]
      x-nodoc-operation-safety:
        class: read-only
        tenantMutationObserved: false
      x-nodoc-evidence:
        record: ../evidence/defender-sentinel-graph-refresh.json
        responseShapeDigest: 3eae6310778a88b36d764cc64c1ae30b5183ba8d22808f09cf8847483b44ff47
      parameters:
        - name: graphTypes
          in: query
          required: false
          description: Comma-separated graph types requested by the portal.
          schema:
            type: string
      responses:
        '200':
          description: Available security graph instances.
          content:
            application/json:
              schema:
                type: object
                required: [value]
                properties:
                  value:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
              example:
                value: []
        '401':
          $ref: common.yml#/components/responses/Unauthorized
        '403':
          $ref: common.yml#/components/responses/Forbidden

  /securityplatform/lake/databases:
    get:
      summary: List data lake databases
      description: >-
        Retrieve a list of databases available in the security data lake.
        The data lake provides unified access to security data across
        Defender XDR workloads.
      operationId: DataLake.ListDatabases
      tags: [Data Lake]
      parameters:
        - name: api-version
          in: query
          description: The API version.
          schema:
            type: string
            default: '2024-07-01'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Database'
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

  /securityplatform/lake/kql/v1/rest/mgmt:
    get:
      summary: Get data lake table schema
      description: >-
        Retrieve the table schema for the security data lake using a KQL
        management command. Returns detailed column information for each table.
      operationId: DataLake.GetTableSchema
      tags: [Data Lake]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: pending - KQL management query results with table schemas
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

  /securityplatform/sentinelgraph/provisioning/checkTenant:
    post:
      summary: Check Sentinel provisioning
      description: >-
        Check whether the tenant has Sentinel provisioning configured
        for the security platform data lake.
      operationId: DataLake.CheckSentinelProvisioning
      tags: [Data Lake]
      x-nodoc-operation-safety:
        class: read-only-query
        tenantMutationObserved: false
      x-nodoc-evidence:
        record: ../evidence/defender-sentinel-graph-refresh.json
        requestShapeDigest: 44136fa355b3678a1146ad16f7e8649e94fb4fc21fe77e8310c060f61caaff8a
        responseShapeDigest: 4b1451ed740c37b55c3199f05e4b9bd825e4c7fb5f114df0e04fa000c84c45b2
      parameters:
        - name: api-version
          in: query
          schema: {type: string}
          description: Security platform provisioning API version emitted by the portal.
        - name: includeFeatures
          in: query
          schema: {type: boolean}
          description: Include feature eligibility and rollout flags in the response.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: The observed readiness check sends an empty JSON object.
            example: {}
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [accountProperties, eligibleFeatures]
                properties:
                  accountProperties:
                    type: object
                    required: [status, primaryRegion, errorCode, features]
                    properties:
                      status: {type: string}
                      primaryRegion: {type: string}
                      errorCode: {type: string}
                      features:
                        type: object
                        additionalProperties: {type: string}
                  eligibleFeatures:
                    type: array
                    items: {type: string}
              example:
                accountProperties:
                  status: NotProvisioned
                  primaryRegion: westus
                  errorCode: ''
                  features:
                    Graph_USX: Disabled
                    Graph_USX_Optional: Disabled
                    Lake_USX: Disabled
                eligibleFeatures: []
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

  /securityplatform/jobs/details:
    get:
      summary: Get job details
      description: >-
        Retrieve job details for the security data lake and related security platform
        background jobs.
      operationId: DataLake.GetJobDetails
      tags: [Data Lake]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      description: pending - job details entry
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

  /securityplatform/jobs/runs/summary:
    get:
      summary: Get job runs summary
      description: >-
        Retrieve aggregate counters for configured jobs and recent job runs in the
        security platform data lake experience.
      operationId: DataLake.GetJobRunsSummary
      tags: [Data Lake]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalJobs:
                    type: integer
                  enabledJobs:
                    type: integer
                  completedRuns:
                    type: integer
                  inProgressRuns:
                    type: integer
                  recentHealthIssues:
                    type: integer
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

  /securityplatform/lake/kql/query-history:
    get:
      summary: List KQL query history
      description: >-
        Retrieve the recent KQL query history shown by the Defender portal's lake explorer.
      operationId: DataLake.ListQueryHistory
      tags: [Data Lake]
      parameters:
        - name: querySource
          in: query
          description: The originating query experience to filter history by.
          schema:
            type: string
            default: KUSTO_QUERY
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      type: object
                      description: pending - saved query history entry
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

  /securityplatform/sentinelgraph/catalog/tables:
    get:
      summary: List Sentinel graph catalog tables
      description: >-
        Retrieve the Defender portal's Sentinel graph table catalog, including table
        metadata and parquet/Kusto schema details used by the lake explorer.
      operationId: DataLake.ListSentinelGraphCatalogTables
      tags: [Data Lake]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        tableType:
                          type: string
                        provisioningState:
                          type: string
                        parquetSchema:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
                        kustoSchema:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
                      additionalProperties: true
        '401':
          $ref: common.yml#/components/responses/Unauthorized

        '403':
          $ref: common.yml#/components/responses/Forbidden

        '404':
          $ref: common.yml#/components/responses/NotFound

components:
  schemas:
    Database:
      type: object
      description: A security data lake database.
      properties:
        name:
          description: The database name.
          type: string
        tables:
          description: Tables in the database.
          type: array
          items:
            type: object
            properties:
              name:
                description: The table name.
                type: string
              description:
                description: A description of the table.
                type: string
